# End-to-end tests (import pages, Goraiya, on-page editing) against a throwaway site with a fake AI provider.
# Dependabot patch updates of the test tools merge into develop automatically when this passes; others wait for a person.
name: End-to-end tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, zip, curl, mbstring, dom
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Install a throwaway Slate site
        run: php bin/ci-install http://127.0.0.1:8000
        env:
          SLATE_CI_PASS: ci-password-123
      - name: Fake AI provider (no keys, no cost)
        run: |
          php -S 127.0.0.1:8097 bin/mock-ai > mock-ai.log 2>&1 &
          php bin/ci-ai http://127.0.0.1:8097/v1
      - name: Start PHP
        run: PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8000 dev-server.php > php.log 2>&1 &
      - run: npx playwright test
        env:
          SLATE_URL: http://127.0.0.1:8000
          SLATE_PASS: ci-password-123
          SLATE_MOCK_AI: '1'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: |
            test-results/
            playwright-report/
            php.log
          retention-days: 14

  automerge:
    needs: test
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
