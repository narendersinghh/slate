<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linkhaus</title>
  <meta name="description" content="A small site imported by its address.">
  <link rel="icon" href="img/favicon.svg">
  <link rel="stylesheet" href="css/main.css?v=2">
  <style>.note{color:rgb(5, 6, 7)}</style>
</head>
<body class="lh-home">
  <header class="top"><img src="img/logo.svg" alt="Linkhaus" class="logo"><nav><a href="./">Home</a> <a href="team/">Team</a> <a href="https://example.org/elsewhere">Elsewhere</a></nav></header>
  <section class="hero">
    <h1>Fetched by its address</h1>
    <p>Everything this page uses comes along.</p>
    <a class="btn-primary" href="team/#people">Meet the team</a>
  </section>
  <div class="grid">
    <div class="card"><h3>Styles</h3><p>Stylesheets, imports and fonts.</p></div>
    <div class="card"><h3>Images</h3><p>Sources, srcsets and posters.</p></div>
    <div class="card"><h3>Scripts</h3><p>Stored as files, never run.</p></div>
  </div>
  <blockquote>Good pages travel well.<cite>Somebody</cite></blockquote>
  <img src="img/photo.svg" srcset="img/photo.svg 1x, img/photo-2x.svg 2x" alt="Photo">
  <video poster="img/poster.svg" width="320" height="180"></video>
  <img src="img/gone.png" alt="Missing on purpose">
  <p class="note" style="color:red;text-align:center">A note with its own style.</p>
  <script src="js/site.js"></script>
</body>
</html>
